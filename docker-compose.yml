services:
  db:
    image: postgis/postgis:16-3.4
    container_name: feste-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feste_db}
      POSTGRES_USER: ${POSTGRES_USER:-feste_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feste_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feste_user} -d ${POSTGRES_DB:-feste_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: feste-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./apps/api
    container_name: feste-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://feste_user:feste_password@db:5432/feste_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_SECRET: ${APP_SECRET:-change-me}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: feste-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Feste Italia}
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
